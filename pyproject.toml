[tool.ruff]
line-length = 88
target-version = "py311"
[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import ordering), B: flake8-bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP035", "UP007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"