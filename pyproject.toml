[project]
name = "miki"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"
[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort (import ordering), B: flake8-bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP035", "UP007", "E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"